<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ef">
  <title>Chess Movement Dashboard</title>
  <script>
    tailwind = {
      theme: {
        extend: {
          colors: {
            ink: "#25302d", muted: "#78817b", paper: "#f5f4ef",
            sage: "#dce8dc", cream: "#f3ead8", frame: "#c9ab82",
            "axis-sage": "#eff5e9", "axis-cream": "#fff7e8",
            "active-sage": "#f5f8ee", "active-cream": "#fffdf6"
          },
          boxShadow: {
            board: "0 20px 46px rgba(91,73,49,.13), 0 3px 8px rgba(91,73,49,.08)",
            panel: "0 16px 42px rgba(67,76,65,.07)"
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-w-[760px] min-h-screen overflow-hidden bg-paper font-sans text-ink">
  <div class="flex min-h-screen flex-col">
    <header class="flex h-[76px] shrink-0 items-center justify-between border-b border-[#474f4617] px-[5.2vw]">
      <div class="flex items-center gap-3 text-[13px] font-bold uppercase tracking-[.13em]">
        <span class="grid size-[31px] place-items-center rounded-[9px] border border-[#bca27f] text-[#806b50]">♞</span>
        <span>Chess study</span>
      </div>
      <div class="text-xs uppercase tracking-[.08em] text-muted">Movement dashboard</div>
    </header>

    <main class="mx-auto flex w-[min(1220px,90vw)] min-h-0 flex-1 -translate-x-[2.2vw] items-center justify-between gap-[clamp(42px,7vw,108px)]">
      <section class="flex shrink-0 flex-col items-center" aria-label="Chessboard">
        <h2 class="mb-[17px] flex w-full items-center gap-[10px] text-xs font-bold uppercase tracking-[.16em] text-[#5b655e] before:size-[7px] before:rounded-full before:bg-[#b5c5b3] before:content-['']">Opponent</h2>
        <div class="grid grid-cols-[25px_auto] grid-rows-[auto_25px] gap-x-[9px] gap-y-[5px]">
          <div class="grid grid-rows-8 items-center justify-items-center font-serif text-[13px] text-[#897a65]" aria-hidden="true">
            <span>8</span><span>7</span><span>6</span><span>5</span>
            <span>4</span><span>3</span><span>2</span><span>1</span>
          </div>
          <div class="grid size-[min(64vh,50vw,620px)] grid-cols-8 grid-rows-8 overflow-hidden rounded-lg border-[9px] border-frame bg-cream shadow-board" id="chessboard" role="grid" aria-label="Empty 8 by 8 chessboard"></div>
          <div class="col-start-2 grid grid-cols-8 items-center justify-items-center font-serif text-[13px] text-[#897a65]" aria-hidden="true">
            <span>A</span><span>B</span><span>C</span><span>D</span>
            <span>E</span><span>F</span><span>G</span><span>H</span>
          </div>
        </div>
        <h2 class="mt-4 flex w-full items-center gap-[10px] text-xs font-bold uppercase tracking-[.16em] text-[#5b655e] before:size-[7px] before:rounded-full before:bg-[#c8a980] before:content-['']">You</h2>
      </section>

      <aside class="mt-[27px] w-[min(330px,27vw)] shrink-0 rounded-[17px] border border-[#5b655e24] bg-[#fffffbbd] p-[27px_26px_25px] shadow-panel backdrop-blur" aria-labelledby="panel-title">
        <p class="mb-[10px] text-[10px] font-bold uppercase tracking-[.17em] text-[#8a795f]">Your turn</p>
        <h1 class="font-serif text-[clamp(25px,2.5vw,34px)] font-normal tracking-[-.035em]" id="panel-title">Enter a move</h1>
        <p class="mb-6 mt-[10px] text-[13px] leading-relaxed text-muted">Add a move in standard chess notation and check its format.</p>
        <form id="move-form" novalidate>
          <label class="mb-2 block text-[11px] font-bold uppercase tracking-[.09em] text-[#59635c]" for="move-input">PGN / SAN notation</label>
          <input class="h-12 w-full rounded-lg border border-[#d8d8cc] bg-[#fffefa] px-[14px] font-serif text-base text-ink outline-none placeholder:text-[#a7aaa0] focus:border-[#9eac98] focus:ring-[3px] focus:ring-[#aec1a933] aria-[invalid=true]:border-[#cf7770] aria-[invalid=true]:ring-[3px] aria-[invalid=true]:ring-[#cf77701f]" id="move-input" name="move" type="text" placeholder="e.g. Nf3 or 1. e4" autocomplete="off" spellcheck="false" aria-describedby="move-result notation-note">
          <button class="mt-[11px] h-[45px] w-full rounded-lg bg-[#596a5c] text-xs font-semibold uppercase tracking-[.1em] text-[#fffdf8] transition hover:bg-[#465849] active:translate-y-px focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-[3px] focus-visible:outline-[#b9c9b4]" type="submit">Move</button>
          <p class="mb-0 mt-[15px] min-h-5 text-xs font-semibold tracking-[.02em]" id="move-result" role="status" aria-live="polite"></p>
        </form>
        <p class="mt-[18px] border-t border-[#5b655e1f] pt-[15px] text-[11px] leading-relaxed text-[#8a9188]" id="notation-note">Enter one move, such as e4, Nf3, O-O, or 1. e4. This checks notation format only; board position and legal-move checking can be added later.</p>
      </aside>
    </main>
  </div>

  <script>
    const board = document.querySelector("#chessboard");
    const files = "ABCDEFGH";
    const squareColors = {
      light: ["bg-cream", "bg-axis-cream", "bg-active-cream"],
      dark: ["bg-sage", "bg-axis-sage", "bg-active-sage"]
    };

    for (let row = 0; row < 8; row += 1) {
      for (let column = 0; column < 8; column += 1) {
        const rank = 8 - row;
        const tone = (row + column) % 2 === 0 ? "light" : "dark";
        const square = document.createElement("button");
        square.type = "button";
        square.className = `relative grid cursor-crosshair place-items-center border-0 p-0 transition-colors duration-100 ${squareColors[tone][0]} focus-visible:z-10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[-3px] focus-visible:outline-[#806b50]`;
        square.dataset.row = String(row);
        square.dataset.column = String(column);
        square.dataset.tone = tone;
        square.dataset.square = `${files[column]}${rank}`;
        square.setAttribute("role", "gridcell");
        square.setAttribute("aria-label", `${files[column]}${rank}`);
        square.innerHTML = `<span class="pointer-events-none absolute left-[5px] top-[5px] rounded bg-[#434c41d1] px-[5px] py-[3px] font-sans text-[10px] font-semibold leading-none tracking-[.04em] text-[#fffdf8] opacity-0">${files[column]}${rank}</span>`;
        square.addEventListener("mouseenter", () => highlightSquare(square));
        square.addEventListener("focus", () => highlightSquare(square));
        square.addEventListener("mouseleave", clearHighlights);
        square.addEventListener("blur", clearHighlights);
        board.append(square);
      }
    }

    function setSquareState(square, state) {
      const [base, axis, active] = squareColors[square.dataset.tone];
      square.classList.remove(base, axis, active);
      square.classList.add(state === "active" ? active : state === "axis" ? axis : base);
      square.querySelector("span").classList.toggle("opacity-100", state === "active");
    }

    function highlightSquare(activeSquare) {
      const { row, column } = activeSquare.dataset;
      board.querySelectorAll("button").forEach((square) => {
        const sharesAxis = square.dataset.row === row || square.dataset.column === column;
        setSquareState(square, square === activeSquare ? "active" : sharesAxis ? "axis" : "base");
      });
    }

    function clearHighlights() {
      board.querySelectorAll("button").forEach((square) => setSquareState(square, "base"));
    }

    const moveForm = document.querySelector("#move-form");
    const moveInput = document.querySelector("#move-input");
    const moveResult = document.querySelector("#move-result");
    const sanMovePattern = /^(?:(?:O|0)-(?:O|0)(?:-(?:O|0))?|(?:[KQRBN](?:[a-h][1-8]?|[1-8])?x?[a-h][1-8](?:=[QRBN])?|[a-h]x[a-h][1-8]|[a-h][1-8](?:=[QRBN])?)[+#]?)(?:[!?]{1,2})?$/;
    const numberedMovePattern = /^(?:\d+\.(?:\.\.\.)?\s*)?(.+)$/;

    moveForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const enteredMove = moveInput.value.trim();
      const moveMatch = enteredMove.match(numberedMovePattern);
      const sanMove = moveMatch ? moveMatch[1].trim() : "";
      const isValid = sanMovePattern.test(sanMove);

      moveInput.setAttribute("aria-invalid", String(!isValid));
      moveResult.className = `mb-0 mt-[15px] min-h-5 text-xs font-semibold tracking-[.02em] ${isValid ? "text-[#4c7656]" : "text-[#bd4d48]"}`;
      moveResult.textContent = isValid ? "Good move · valid notation" : "Invalid notation";
    });

    moveInput.addEventListener("input", () => {
      moveInput.removeAttribute("aria-invalid");
      moveResult.textContent = "";
      moveResult.className = "mb-0 mt-[15px] min-h-5 text-xs font-semibold tracking-[.02em]";
    });
  </script>
</body>
</html>
